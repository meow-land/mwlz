[package]
name = "mwlz"
version = "0.1.1"
edition = "2024"
authors = ["meow-land"]
repository = "https://github.com/meow-land/mwlz"
description = "Deterministic dictionary compressor based on prefix trees and quantum byte-packs"
license = "Apache-2.0"
readme = "README.md"
keywords = ["compression", "lzw", "lz", "no-std", "embedded"]
categories = ["compression", "no-std"]

include = [
    "src/**/*",
    "tests/**/*",
    "examples/**/*",
    "LICENSE*",
    "README.md",
    "Cargo.toml",
]

[lib]
name = "mwlz"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
mwhash = { version = "0.1.1", default-features = false }
